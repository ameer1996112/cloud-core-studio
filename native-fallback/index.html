<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Cloud & Core</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #0b1d3a;
        --ivory: #faf7f2;
        --gold: #d4af6a;
        --sand: #e8dfd1;
        --slate: #6f7a8c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        background: var(--ivory);
        color: var(--navy);
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", "Noto Naskh Arabic", "Segoe UI",
          sans-serif;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(250, 247, 242, 0.4) 0%,
            rgba(250, 247, 242, 0.82) 36%,
            rgba(250, 247, 242, 0.98) 100%
          ),
          url("./images/auth/cloud-core-auth-hero.webp") center / cover no-repeat;
        opacity: 0.92;
      }

      body::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 8%, rgba(212, 175, 106, 0.16), transparent 34%);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 460px);
        border: 1px solid rgba(232, 223, 209, 0.92);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 24px 56px rgba(11, 29, 58, 0.08);
        backdrop-filter: blur(10px);
        padding: 32px 28px 30px;
        text-align: center;
      }

      .brand {
        display: block;
        width: min(320px, 84vw);
        height: auto;
        margin: 0 auto;
      }

      .line {
        width: 56px;
        height: 1px;
        margin: 24px auto 18px;
        background: var(--gold);
      }

      p {
        margin: 0;
        color: var(--slate);
        line-height: 1.7;
        font-size: 15px;
      }

      @media (max-width: 480px) {
        main {
          width: min(100%, 392px);
          padding: 28px 22px 26px;
          border-radius: 24px;
        }

        .brand {
          width: min(280px, 78vw);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="./brand/cloud-core-logo-full.png" alt="Cloud & Core" />
      <div class="line" aria-hidden="true"></div>
      <p>האפליקציה צריכה חיבור אינטרנט כדי לפתוח את הסטודיו. נסו שוב בעוד רגע.</p>
    </main>
  </body>
</html>
