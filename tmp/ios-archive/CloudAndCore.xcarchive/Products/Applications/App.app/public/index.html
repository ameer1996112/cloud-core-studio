<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Cloud & Core</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #0b1d3a;
        --ivory: #faf7f2;
        --gold: #d4af6a;
        --slate: #6f7a8c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        background: var(--ivory);
        color: var(--navy);
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", "Noto Naskh Arabic", "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(212, 175, 106, 0.45);
        background: rgba(255, 255, 255, 0.74);
        padding: 32px 28px;
        text-align: center;
      }

      .brand {
        display: block;
        width: min(260px, 80vw);
        height: auto;
        margin: 0 auto;
      }

      .line {
        width: 56px;
        height: 1px;
        margin: 22px auto;
        background: var(--gold);
      }

      p {
        margin: 0;
        color: var(--slate);
        line-height: 1.7;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="/brand/cloud-core-logo-full.svg" alt="Cloud & Core" />
      <div class="line" aria-hidden="true"></div>
      <p>האפליקציה צריכה חיבור אינטרנט כדי לפתוח את הסטודיו. נסו שוב בעוד רגע.</p>
    </main>
  </body>
</html>
